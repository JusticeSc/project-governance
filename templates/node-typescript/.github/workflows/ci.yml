name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v5
        with:
          version: 11.28.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.10'
      - run: python -m pip install -r .github/review-ownership/requirements.txt
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run the same complete local gate graph
        env:
          DSH_ARCHIVE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before != '0000000000000000000000000000000000000000' && github.event.before || github.sha }}
          # Shared runners delay cases that inherit Vitest's 5000ms default, and this
          # graph runs partitions beside sibling gates; the same budget the reference
          # repository grants its coverage lanes.
          DSH_COVERAGE_TEST_TIMEOUT_MS: '90000'
        run: pnpm run check:ci
  all-checks-passed:
    if: always()
    needs: [checks]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success
